plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pindou.studio'
    compileSdk 36

    defaultConfig {
        applicationId 'com.pindou.studio'
        minSdk 26
        targetSdk 36
        versionCode 40
        versionName '3.4.0'
    }

    sourceSets {
        main {
            assets.srcDirs = ['../../']
            assets.includes = ['index-pro.html']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
